# Le pagine sono pubblicate da GitHub Pages a partire dal branch `gh-pages`
# (sorgente "Deploy from a branch"). Questo workflow allinea `gh-pages` a `main`
# a ogni push, cosi' il sito pubblicato resta uguale al contenuto del repository.
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Allinea gh-pages a main
        run: git push origin HEAD:refs/heads/gh-pages --force
